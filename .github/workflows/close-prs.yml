name: Close pull requests
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr close "$PR" --repo "$REPO" --comment "Thanks for your interest — this repository does not accept pull requests (see CONTRIBUTING.md). Feel free to fork."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
